; One environment per build: an app from src/ plus the board header that says how the
; motherboard is populated. Adding a build is an [env:...] block, not a new project.
;
;   src/<app>/           the program
;   lib/atech_glue/      the SDK glue the Atech platform does not ship (AtechSerial, UI helpers)
;   lib/atech_board/     the module instances and layout of one board build, picked by -D
;   lib/atech_*/         the real drivers, synced from the open SDK (make sync-sdk)

[platformio]
default_envs = pocket-synth
src_dir = src

[env]
platform = espressif32@6.9.0          ; Arduino core 2.0.17 — the API level the Atech SDK targets
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
lib_ldf_mode = deep+                  ; the SDK drivers are reached through the glue headers, not from the app directly
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1       ; Serial = native USB-Serial/JTAG, as the SDK's own build does
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit NeoPixel

; ---- builds ---------------------------------------------------------------------------------
[env:pocket-synth]
build_src_filter = -<*> +<pocket-synth/>
build_flags = ${env.build_flags} -DATECH_BOARD_ATECH14_SYNTH

[env:grid-selftest]
build_src_filter = -<*> +<grid-selftest/>
build_flags = ${env.build_flags} -DATECH_BOARD_ATECH14_SYNTH

[env:sid-theremin]
build_src_filter = -<*> +<sid-theremin/>
build_flags =
    ${env.build_flags}
    -DATECH_BOARD_ATECH14_THEREMIN
    -DCRSID_SID_ONLY                 ; cRSID's SID without a C64 around it (src/sid-theremin/sid_chip.h): do not add the tune player to this build
lib_deps =
    ${env.lib_deps}
    sparkfun/SparkFun VL53L5CX Arduino Library   ; what the SDK's distance_sensor driver wraps
